<button onclick="moveTopLine()">Move Top Line to Bottom & Copy</button>

<script>
async function moveTopLine() {
    const textArea = document.getElementById('myTextArea');
    
    // Get the content as an array of lines
    let lines = textArea.value.split('\n');
    
    // Safety check to ensure there is at least one line
    if (lines.length > 1) {
        // Remove the first line
        const topLine = lines.shift();

        // Copy the top line to the clipboard
        try {
            await navigator.clipboard.writeText(topLine);
            console.log('Copied to clipboard:', topLine);
        } catch (err) {
            console.error('Failed to copy!', err);
        }
        
        // Push the top line to the bottom
        lines.push(topLine);

        // Re-join the lines and update the textarea
        textArea.value = lines.join('\n');
    }
}
</script>
